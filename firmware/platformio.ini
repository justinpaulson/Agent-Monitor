; Firmware for the ESP32-2424S012C (ESP32-C3, 1.28" round GC9A01, CST816 touch).
; Build + flash:  pio run -t upload      Serial log:  pio device monitor

[env:esp32-2424s012c]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.0.0
